
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 여행 플래너</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f0f5f9;
            color: #203349;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .logo {
            color: #328b8b;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .header {
            background: #328b8b;
            color: white;
            padding: 35px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #e8eff2;
            font-size: 21px;
        }

        .content {
            line-height: 1.9;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* 로딩 화면 */
        #loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e2eeee;
            border-top-color: #328b8b;
            border-radius: 50%;
            margin: 0 auto 25px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 처음에는 결과 영역 숨기기 */
        #result {
            display: none;
        }

        #error {
            display: none;
            background: #fef2f2;
            color: #b91c1c;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .back-button {
            display: block;
            padding: 16px;
            border: 1px solid #328b8b;
            border-radius: 10px;
            color: #328b8b;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
        }

        .back-button:hover {
            background: #328b8b;
            color: white;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="logo">
            🌍 AI TRAVEL PLANNER
        </div>

        <div class="header">
            <small>YOUR NEXT DESTINATION</small>

            <h1>{{ destination }} 여행 플랜</h1>

            <p>당신을 위한 맞춤형 여행 일정</p>

            <div class="features">
                <span>📅 1박 2일</span>
                <span>🚆 교통</span>
                <span>🍴 맛집 추천</span>
            </div>
        </div>

        <!-- AJAX 요청에 필요한 데이터 -->
        <form id="tour-form" hidden>
            {% csrf_token %}

            <input type="hidden"
                   name="destination"
                   value="{{ destination }}">
        </form>

        <!-- 로딩 화면 -->
        <div id="loading" class="card" role="status">

            <div class="spinner"></div>

            <h2>AI가 여행 일정을 설계하고 있습니다</h2>

            <p>여행지, 숙소, 맛집을 정리하고 있어요.</p>

        </div>

        <!-- 오류 메시지 -->
        <div id="error" role="alert"></div>


        <!-- 여행 일정 결과 -->
        <div id="result">

            <section class="card">
                <h2>📅 한눈에 보는 여행 일정</h2>
                <div id="schedule" class="content"></div>
            </section>

            <section class="card">
                <h2>📍 여행지 설명</h2>
                <div id="places" class="content"></div>
            </section>

            <div class="grid">

                <section class="card">
                    <h2>🏨 숙소 추천</h2>
                    <div id="hotels" class="content"></div>
                </section>

                <section class="card">
                    <h2>🍴 식사 추천</h2>
                    <div id="foods" class="content"></div>
                </section>

            </div>

        </div>

        <a href="/" class="back-button">
            ← 새로운 여행 일정 짜기
        </a>

    </div>


    <script>

        // 여행 일정 생성 함수
        async function generateTour() {

            const form = document.getElementById('tour-form');
            const formData = new FormData(form);

            try {

                // AJAX 요청
                const response = await fetch("/tour/tour/", {
                    method: 'POST',
                    body: formData
                });

                // 서버에서 받은 데이터 변환
                const data = await response.json();

                // 오류 확인
                if (!response.ok) {
                    throw new Error(
                        data.error || '여행 일정 생성 실패'
                    );
                }

                // 각 영역에 데이터 출력
                document.getElementById('schedule')
                    .textContent = data.schedule;

                document.getElementById('places')
                    .textContent = data.places;

                document.getElementById('hotels')
                    .textContent = data.hotels;

                document.getElementById('foods')
                    .textContent = data.foods;

                // 로딩 화면 숨기기
                document.getElementById('loading')
                    .style.display = 'none';

                // 결과 화면 보여주기
                document.getElementById('result')
                    .style.display = 'block';

            } catch (error) {

                // 로딩 화면 숨기기
                document.getElementById('loading')
                    .style.display = 'none';

                // 오류 화면 보여주기
                document.getElementById('error')
                    .style.display = 'block';

                document.getElementById('error')
                    .textContent = error.message;
            }
        }

        // 페이지가 열리면 자동 실행
        generateTour();

    </script>

</body>
</html>
