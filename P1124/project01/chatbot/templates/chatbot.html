
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 여행 메이트</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f0f5f9;
            color: #203349;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* 상단 메뉴 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            color: #328b8b;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .home-link {
            color: #64748b;
            font-size: 14px;
            text-decoration: none;
        }

        /* 전체 채팅창 */
        .chat-container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.06);
        }

        /* 채팅창 상단 */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #328b8b;
            color: white;
            padding: 25px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
        }

        .chat-header h1 {
            margin: 0 0 7px;
            font-size: 22px;
        }

        .chat-header p {
            margin: 0;
            font-size: 13px;
            opacity: 0.85;
        }

        /* 대화가 표시되는 영역 */
        .chat-messages {
            height: 55vh;
            min-height: 300px;
            padding: 25px;
            overflow-y: auto;

            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .chat-date {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .bot-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #e3f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .bubble {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* AI 답변 말풍선 */
        .bot-message .bubble {
            background: #f0f5f9;
            color: #203349;
            border-top-left-radius: 3px;
        }

        /* 사용자 질문 말풍선 */
        .user-message {
            justify-content: flex-end;
        }

        .user-message .bubble {
            background: #328b8b;
            color: white;
            border-top-right-radius: 3px;
        }

        /* 메시지 입력 영역 */
        .chat-footer {
            padding: 20px;
            border-top: 1px solid #e5e9ee;
        }

        .input-form {
            display: flex;
            align-items: stretch;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            min-width: 0;
            padding: 16px;
            border: 1px solid #dce4eb;
            border-radius: 12px;
            background: #f9fafc;
            font-size: 15px;
            outline-color: #328b8b;
        }

        .send-button {
            padding: 15px 25px;
            background: #328b8b;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-button:hover {
            background: #246d6d;
        }

        .notice {
            margin: 15px 0 0;
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
        }

        /* 모바일 화면 대응 */
        @media (max-width: 600px) {
            .chat-messages {
                padding: 15px;
            }

            .bubble {
                max-width: 85%;
                font-size: 14px;
            }

            .send-button {
                padding: 12px 16px;
            }

            .logo {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 상단 메뉴 -->
        <nav class="navbar">
            <div class="logo">
                🌍 AI TRAVEL PLANNER
            </div>
            <a href="/" class="home-link">
                ← 메인으로 돌아가기
            </a>
        </nav>

        <div class="chat-container">
            <!-- 챗봇 소개 -->
            <header class="chat-header">
                <div class="avatar">🤖</div>

                <div>
                    <h1>AI 여행 메이트</h1>
                    <p>당신의 여행을 함께 설계합니다.</p>
                </div>
            </header>

            <!-- 대화 표시 영역 -->
            <div class="chat-messages" id="chat-messages">

                <div class="chat-date">
                    새로운 여행 이야기
                </div>

                <!-- AI 첫 인사 -->
                <div class="message bot-message">

                    <div class="bot-icon">🤖</div>

                    <div class="bubble">안녕하세요! 당신의 AI 여행 메이트입니다. 👋
                        여행 일정부터 숨겨진 명소, 맛집, 교통편까지 무엇이든 물어보세요.
                        어떤 여행을 계획하고 계신가요?</div>
                </div>

            </div>

            <!-- 메시지 입력 영역 -->
            <footer class="chat-footer">

                <form method="POST"
                      id="chat-form"
                      class="input-form">
                    {% csrf_token %}
                    <input type="text"
                           name="message"
                           id="message-input"
                           class="message-input"
                           placeholder="여행에 대해 무엇이든 물어보세요..."
                           aria-label="여행 질문"
                           autocomplete="off"
                           required>
                    <button type="submit" class="send-button">
                        전송 ➤
                    </button>
                </form>
                <p class="notice">
                    AI가 제공하는 정보는 실제 여행 전에 다시 확인해주세요.
                </p>
            </footer>
        </div>
    </div>

<script>

    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const messages = document.getElementById('chat-messages');
    const sendButton = form.querySelector('button');


    // 말풍선 생성 함수
    function addMessage(text, role) {

        const message = document.createElement('div');

        message.className = 'message ' + role + '-message';

        // AI 아이콘 추가
        if (role === 'bot') {
            const icon = document.createElement('div');
            icon.className = 'bot-icon';
            icon.textContent = '🤖';
            message.appendChild(icon);
        }

        // 말풍선 생성
        const bubble = document.createElement('div');

        bubble.className = 'bubble';
        bubble.textContent = text;

        message.appendChild(bubble);
        messages.appendChild(message);

        // 채팅창 자동 스크롤
        messages.scrollTop = messages.scrollHeight;

        return bubble;
    }


    // 전송 버튼 클릭 시 실행
    form.addEventListener('submit', async function(event) {

        // 페이지 새로고침 방지
        event.preventDefault();

        const question = input.value.trim();

        if (!question || sendButton.disabled) {
            return;
        }

        // 입력 데이터 저장
        const formData = new FormData(form);

        // 사용자 질문 표시
        addMessage(question, 'user');

        // 입력창 비우기
        input.value = '';

        // 중복 전송 방지
        sendButton.disabled = true;
        input.disabled = true;

        // AI 응답 대기 말풍선
        const loading = addMessage(
            '답변을 생각하고 있습니다...', 'bot'
        );

        try {

            // AJAX 요청
            const response = await fetch(
                "/chatbot/chatbot/",
                {
                    method: 'POST',
                    body: formData
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || '응답 실패');
            }

            // AI 답변으로 말풍선 변경
            loading.textContent = data.answer;

        } catch (error) {

            loading.textContent = '오류: ' + error.message;

        } finally {

            // 다시 질문할 수 있도록 설정
            sendButton.disabled = false;
            input.disabled = false;

            input.focus();

            // 채팅창 자동 스크롤
            messages.scrollTop = messages.scrollHeight;
        }

    });

</script>

</body>
</html>
